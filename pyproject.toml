[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-seller-analyzer"
version = "0.1.0"
description = "Python SDK for Amazon Seller Analyzer on Apify. Amazon Seller Analyzer estimates competitor sales and revenue by day, month, and year. Run fast bulk seller analysis with no Amazon login or cookies required, product-level ranges, Buy Box signals, strategy tracking, JSON/CSV/Excel exports, and API acc"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ApiVault Labs" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0"]
keywords = ["amazon", "amazon-seller", "sales-estimator", "revenue-estimation", "buy-box", "competitor-analysis", "apify", "python-sdk"]

[project.urls]
Homepage = "https://github.com/apivault-labs/amazon-seller-analyzer-python"
Documentation = "https://github.com/apivault-labs/amazon-seller-analyzer-python#readme"
"Apify Actor" = "https://apify.com/apivault_labs/amazon-seller-revenue-strategy-analyzer"
"Bug Tracker" = "https://github.com/apivault-labs/amazon-seller-analyzer-python/issues"

[tool.setuptools.packages.find]
include = ["amazon_seller_analyzer*"]
